<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b6c0cf"/>
    </marker>
  </defs>

  <rect width="1180" height="640" fill="#ffffff"/>

  <!-- ================= Connectors ================= -->
  <g fill="none" stroke="#b6c0cf" stroke-width="2.5">
    <path d="M300,325 C365,325 375,110 431,110"/>
    <path d="M300,325 L431,325"/>
    <path d="M300,325 C365,325 375,540 431,540"/>
    <path d="M785,110 C840,110 850,300 871,300"/>
    <path d="M785,325 L871,325"/>
    <path d="M785,540 C840,540 850,350 871,350"/>
  </g>
  <g fill="#b6c0cf">
    <polygon points="424,105 435,110 424,115"/>
    <polygon points="424,320 435,325 424,330"/>
    <polygon points="424,535 435,540 424,545"/>
    <polygon points="864,295 875,300 864,305"/>
    <polygon points="864,320 875,325 864,330"/>
    <polygon points="864,345 875,350 864,355"/>
  </g>
  <g font-size="12.5" fill="#8a94a6" font-style="italic">
    <text x="360" y="203">correspondance</text>
    <text x="360" y="316">similarité</text>
    <text x="372" y="470">contenu aimé</text>
  </g>

  <!-- ================= Profil ================= -->
  <g filter="url(#sh)">
    <rect x="40" y="245" width="260" height="160" rx="18" fill="#eff5fc" stroke="#cdddf0"/>
  </g>
  <circle cx="78" cy="310" r="22" fill="#3b6ea5"/>
  <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round">
    <circle cx="78" cy="305" r="5"/>
    <path d="M69,321 C69,313 87,313 87,321"/>
  </g>
  <text x="112" y="306" font-size="16" font-weight="700" fill="#1e293b">Profil de l'usager</text>
  <text x="112" y="325" font-size="12.5" fill="#64748b">ses réponses au questionnaire</text>
  <text x="60" y="366" font-size="12.5" font-style="italic" fill="#7c3aed">+ ressources enregistrées et aimées</text>

  <!-- ================= Pilier 1 : COSM ================= -->
  <g filter="url(#sh)">
    <rect x="435" y="30" width="350" height="160" rx="18" fill="#fef4f4" stroke="#f6d5d5"/>
  </g>
  <circle cx="475" cy="72" r="22" fill="#dc2626"/>
  <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M475,61 L466,65 L466,74 C466,80 471,83 475,84 C479,83 484,80 484,74 L484,65 Z"/>
    <path d="M471,73 L474,76 L480,69"/>
  </g>
  <text x="510" y="66" font-size="16.5" font-weight="700" fill="#991b1b">Le COSM</text>
  <text x="510" y="84" font-size="12.5" fill="#b45c5c">choix éditorial des experts</text>
  <g font-size="13" fill="#475569">
    <text x="456" y="112">Des « audiences » (personas) définies par le COSM.</text>
    <text x="456" y="132">Le profil qui y correspond fait remonter ses ressources.</text>
  </g>
  <g>
    <rect x="456" y="146" width="308" height="28" rx="14" fill="#fbe0e0"/>
    <text x="610" y="164" font-size="12.5" font-weight="600" fill="#b03a3a" text-anchor="middle">« Recommandé par les administrateurs »</text>
  </g>

  <!-- ================= Pilier 2 : Communauté ================= -->
  <g filter="url(#sh)">
    <rect x="435" y="245" width="350" height="160" rx="18" fill="#ecfbff" stroke="#c6ecf5"/>
  </g>
  <circle cx="475" cy="287" r="22" fill="#0891b2"/>
  <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round">
    <circle cx="469" cy="282" r="4"/>
    <circle cx="481" cy="282" r="4"/>
    <path d="M462,297 C462,289 476,289 476,297"/>
    <path d="M474,297 C474,289 488,289 488,297"/>
  </g>
  <text x="510" y="281" font-size="16.5" font-weight="700" fill="#155e75">La communauté</text>
  <text x="510" y="299" font-size="12.5" fill="#4d92a3">des personnes dans une situation proche</text>
  <g font-size="13" fill="#475569">
    <text x="456" y="327">Des profils en situation proche de la sienne.</text>
    <text x="456" y="347">Ce qu'ils trouvent utile lui est proposé.</text>
  </g>
  <g>
    <rect x="456" y="361" width="290" height="28" rx="14" fill="#d3edf4"/>
    <text x="601" y="379" font-size="12.5" font-weight="600" fill="#0e7490" text-anchor="middle">« Utile à des profils similaires »</text>
  </g>

  <!-- ================= Pilier 3 : Comportement de l'usager ================= -->
  <g filter="url(#sh)">
    <rect x="435" y="460" width="350" height="160" rx="18" fill="#f6f3fe" stroke="#ded1fa"/>
  </g>
  <circle cx="475" cy="502" r="22" fill="#7c3aed"/>
  <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M469,491 L481,491 L481,514 L475,509 L469,514 Z"/>
  </g>
  <text x="510" y="496" font-size="16" font-weight="700" fill="#5b21b6">Comportement de l'usager</text>
  <text x="510" y="514" font-size="12.5" fill="#8b6fce">ce qu'il garde et apprécie</text>
  <g font-size="13" fill="#475569">
    <text x="456" y="542">Les ressources enregistrées et aimées</text>
    <text x="456" y="562">orientent des suggestions par thèmes proches.</text>
  </g>
  <g>
    <rect x="452" y="576" width="326" height="28" rx="14" fill="#e7dbfb"/>
    <text x="615" y="594" font-size="12.5" font-weight="600" fill="#6d28d9" text-anchor="middle">« Basé sur ce qui est enregistré et aimé »</text>
  </g>

  <!-- ================= Score & tri ================= -->
  <g filter="url(#sh)">
    <rect x="875" y="235" width="292" height="210" rx="18" fill="#f1f5f9" stroke="#d3dbe6"/>
  </g>
  <circle cx="913" cy="278" r="22" fill="#334155"/>
  <g fill="#ffffff">
    <rect x="904" y="270.5" width="18" height="3.4" rx="1.7"/>
    <rect x="904" y="276.8" width="13" height="3.4" rx="1.7"/>
    <rect x="904" y="283.1" width="8" height="3.4" rx="1.7"/>
  </g>
  <text x="947" y="273" font-size="16.5" font-weight="700" fill="#1e293b">Score et tri</text>
  <text x="947" y="291" font-size="12.5" fill="#64748b">comment les signaux se combinent</text>

  <rect x="888" y="308" width="272" height="30" rx="8" fill="#e6ebf2"/>
  <text x="903" y="328" font-size="12" font-weight="700">
    <tspan fill="#334155">score = </tspan><tspan fill="#dc2626">COSM</tspan><tspan fill="#334155"> + </tspan><tspan fill="#0891b2">communauté</tspan><tspan fill="#334155"> + </tspan><tspan fill="#7c3aed">affinité</tspan>
  </text>

  <g font-size="13" fill="#475569">
    <text x="899" y="366">Chaque signal ajoute des points.</text>
    <text x="899" y="388">Les mieux notées remontent en tête.</text>
  </g>
  <text x="899" y="417" font-size="12.5" font-style="italic" fill="#2e8b57">Le regard humain du COSM reste central.</text>
</svg>
